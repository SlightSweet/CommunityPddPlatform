<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区团购平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>欢迎来到社区团购平台</h1>
    <p>请选择登录方式或注册新账户：</p>

    <div class="button-container">
        <!-- 登录团长入口 -->
        <button class="button" onclick="window.location.href='http://localhost:8081/leader/login.html'">团长登录</button>

        <!-- 登录团员入口 -->
        <button class="button" onclick="window.location.href='http://localhost:0/member/login'">团员登录</button>
    </div>

    <div class="button-container">
        <!-- 注册入口 -->
        <button class="button button-register" onclick="window.location.href='/register.html'">注册新账户</button>
    </div>
</div>
</body>
</html>
